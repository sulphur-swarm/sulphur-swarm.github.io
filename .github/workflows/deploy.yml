# ============================================
# GitHub Secrets required for this workflow:
#
#   SSH_PRIVATE_KEY  — Contents of the Ed25519 private SSH key
#                      (from ~/.ssh/id_ed25519.sulphur)
#   VPS_HOST         — VPS IP address (207.148.28.64)
#   VPS_USER         — SSH username on the VPS (e.g., root)
#   VPS_DEPLOY_PATH  — Absolute path to web root on VPS
#                      (e.g., /var/www/sulphur.technology)
# ============================================

name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the site
        run: bun run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          rsync -avz --delete \
            dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_DEPLOY_PATH }}/
